# Render Blueprint: the deployment as a reviewable file, not dashboard fields
# nobody can diff — the same argument as keeping compose in the repo.
databases:
  - name: erp-db
    databaseName: erp
    user: erp
    plan: free

services:
  - type: web
    name: erp-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    # /health, not /: readiness must fail when Postgres is unreachable.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: erp-db, property: connectionString }
      - key: PGSSL          # Render's managed Postgres requires TLS
        value: require
      - key: PORT
        value: 3100
      - key: PG_POOL        # free tier caps connections well below the local 20
        value: 5

  - type: web
    name: erp-console
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 3200
      # API_HOST via fromService resolved to something the console could not
      # reach - every proxied call failed with `fetch failed` while the API was
      # verifiably serving 200s publicly. Pinning the public origin explicitly is
      # deterministic and reviewable; API_HOST stays as the fallback.
      # NOTE for a fresh blueprint apply: Render appends a random suffix to a
      # taken service name, so update this to the new erp-api URL.
      - key: API_ORIGIN
        value: https://erp-api-zc8t.onrender.com
      - key: API_HOST
        fromService: { type: web, name: erp-api, property: host }
